services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: smartfirehub
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d smartfirehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 테스트 전용 DB — 로컬 개발 DB(5432)와 분리하여 테스트 격리 보장
  db-test:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: smartfirehub_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - ./db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d smartfirehub_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GraphRAG용 그래프 DB — dev 전용
  neo4j:
    image: neo4j:5.26-community
    container_name: smart-fire-hub-neo4j
    ports:
      - "7474:7474"   # HTTP 브라우저
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/firehub-graph-dev   # dev 전용 비밀번호
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j-data:
