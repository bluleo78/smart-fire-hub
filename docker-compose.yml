services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: smartfirehub
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d smartfirehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 수동 SQL 테스트·디버깅용 DB. firehub-api Gradle 통합 테스트는 Testcontainers를 사용한다.
  db-test:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: smartfirehub_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - ./db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d smartfirehub_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FILE 오브젝트 데이터셋용 S3 호환 스토리지 (개발용 하드코딩 자격증명)
  minio:
    # MinIO 가 공식 공개 이미지 배포를 중단해 minio/minio·minio/mc 를 더는 받을 수 없다 → 소스로 빌드해 배포하는 Chainguard 이미지를 쓴다.
    # (무료 등급은 latest 태그만 제공. 이미지 안에 sh·mc 가 있어 healthcheck·minio-init 도 같은 이미지로 처리한다.)
    image: cgr.dev/chainguard/minio:latest
    # WD-471: 이 이미지의 기본 실행 사용자는 65532(nonroot)다. 예전 minio/minio 이미지가 root 로 만든 이름 있는 볼륨
    # (miniodata 등)에서는 「unable to rename … file access denied」로 기동이 FATAL 이 된다. macOS 의 바인드 마운트는
    # 권한을 흉내 내 65532 로도 열리지만 이름 있는 볼륨·리눅스 호스트는 그렇지 않다 → 기존 데이터를 옮기지 않고 쓰도록 root 로 돌린다.
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 콘솔 UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 브라우저가 presigned PUT/GET으로 MinIO에 직접 접근할 수 있도록 웹 오리진 CORS 허용.
      # (버킷 단위 mc CORS 설정 대신 서버 전역 환경변수로 간단히 처리 — dev 자동 구성)
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 최초 기동 시 버킷을 자동 생성하는 일회성 컨테이너
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/firehub-files &&
      echo '버킷 준비 완료';
      "

  # GraphRAG용 그래프 DB — dev 전용
  neo4j:
    image: neo4j:5.26-community
    container_name: smart-fire-hub-neo4j
    ports:
      - "7474:7474"   # HTTP 브라우저
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/firehub-graph-dev   # dev 전용 비밀번호
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j-data:
