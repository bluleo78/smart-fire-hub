# web 브랜딩 override — "Smart Data Platform"
#
# web 컨테이너의 기본 /config.js(이미지 내장, "Smart Fire Hub")를 이 ConfigMap 내용으로 교체한다.
# 재빌드 불필요 — 단일 web 이미지를 유지하고 브랜딩만 런타임에 주입한다.
#
# 적용:
#   kubectl apply -f web-branding-configmap.yaml      # (필요 시 -n <namespace>)
# 그리고 web Deployment 에 아래 volume/volumeMount 를 추가한다 (deployment-env-patch.yaml 참고).
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-branding
  labels:
    app: firehub-web
    branding: smart-data-platform
data:
  # 이 값은 config.js 와 동일하게 유지한다. (동일 디렉토리 config.js 가 정본)
  config.js: |
    /*
     * 런타임 브랜딩 설정 — "Smart Data Platform" (사이트별 화이트라벨).
     * web 이미지의 기본 /config.js 를 배포 시점에 교체하기 위한 override.
     */
    (function () {
      var config = {
        brandName: 'Smart Data Platform',
        logoUrl: null,          // null이면 기본 아이콘(Flame). 자체 로고 시 동일 오리진 경로 지정.
        faviconUrl: '/vite.svg',
      };
      window.__APP_CONFIG__ = config;
      if (config.brandName) {
        document.title = config.brandName;
      }
      if (config.faviconUrl) {
        var link = document.querySelector("link[rel='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        link.href = config.faviconUrl;
      }
    })();
