services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfirehub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-smartfirehub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # FILE 오브젝트 데이터셋용 S3 호환 스토리지
  minio:
    # MinIO 가 공개 이미지 배포를 중단해 Docker Hub·quay 에서 더는 받을 수 없다 → 같은 릴리스를 우리 ghcr.io 에 옮겨 두고 쓴다(arm64 전용).
    image: ghcr.io/bluleo78/smart-fire-hub/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    # 브라우저가 presigned URL로 MinIO에 직접 GET/PUT하려면 9000 API 포트를 호스트에 공개해야 한다.
    # (공유기에서 외부 → 호스트:9000 TCP 포워딩 병행 필요. 공개 호스트는 MINIO_PUBLIC_ENDPOINT로 지정.)
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # prod: 브라우저 도달 가능한 공개 웹 오리진을 CORS로 허용해야 썸네일/업로드가 동작한다.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:?web origin required}
    volumes:
      - miniodata:/data
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 최초 기동 시 FILE 데이터셋용 버킷을 자동 생성하는 일회성 컨테이너 (dev docker-compose.yml 의 minio-init 과 동일 역할)
  minio-init:
    image: ghcr.io/bluleo78/smart-fire-hub/minio:RELEASE.2025-04-08T15-41-24Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - firehub-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-firehub-files} &&
      echo '버킷 준비 완료';
      "

  api:
    build:
      context: ./apps/firehub-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_DB: ${POSTGRES_DB:-smartfirehub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 런타임 접속은 비특권 롤 app_tenant(RLS fail-closed, V83). application-prod.yml 이
      # 기본값 없이 ${POSTGRES_RUNTIME_PASSWORD} 를 읽으므로 이 매핑이 없으면 컨텍스트 로딩이 실패한다.
      # compose 의 .env 는 ${...} 치환용이라 여기서 명시하지 않으면 컨테이너에 주입되지 않는다.
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required}
      # executor 호출·기술자 엔드포인트 인증 토큰. executor 의 EXECUTOR_INTERNAL_SERVICE_TOKEN 과 **같은 .env 키**
      # (EXECUTOR_INTERNAL_TOKEN)를 읽는다. 이 매핑이 없으면 .env 를 바꿔도 api 는 기본값을 써서 401 이 난다.
      EXECUTOR_INTERNAL_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-executor-token}
      PIPELINE_EXECUTOR_PASSWORD: ${PIPELINE_EXECUTOR_PASSWORD:?PIPELINE_EXECUTOR_PASSWORD is required}
      # 테넌트별 파이프라인 롤(pipeline_executor_t{id}) 비밀번호 파생 HMAC 키(P3-b1/V111).
      # api 와 executor 가 각자 독립적으로 같은 비밀번호를 파생하므로 두 값이 **반드시 동일**해야 한다
      # → .env 변수 하나를 두 서비스에 매핑한다(아래 executor 의 EXECUTOR_ROLE_PASSWORD_SECRET).
      # 서로 다른 값을 넣으면 기동은 되고 모든 파이프라인 스텝이 DB 인증 실패한다.
      PIPELINE_ROLE_PASSWORD_SECRET: ${PIPELINE_ROLE_PASSWORD_SECRET:?PIPELINE_ROLE_PASSWORD_SECRET is required}
      # FILE 오브젝트 데이터셋용 MinIO 접속 정보. MinIO 컨테이너는 MINIO_ROOT_USER/PASSWORD 이름을 쓰지만
      # API 는 MINIO_ACCESS_KEY/SECRET_KEY 를 읽으므로 여기서 두 이름을 매핑해준다(변수명 불일치 방지).
      MINIO_ENDPOINT: http://minio:9000
      # presign 서명 전용 공개 엔드포인트(브라우저가 직접 도달하는 호스트). 내부 endpoint와 분리한다.
      # 미지정 시 내부 endpoint로 폴백되나, 그 경우 브라우저 업로드/썸네일은 동작하지 않으므로 .env에서 공개 호스트로 지정할 것.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-firehub-files}
      # Tibero 테넌트 SQL 을 보내는 db-executor 주소(WD-77). 같은 네트워크의 db-executor 서비스를 가리킨다.
      DB_EXECUTOR_BASE_URL: http://db-executor:8090
      # db-executor 전용 내부 토큰(스펙 §3.4) — Python 실행기의 EXECUTOR_INTERNAL_TOKEN 과 **반드시 다른 값**이다
      # (같으면 api 기동 실패). 새 비밀값이라 기본값 없이 필수로 받는다.
      DB_EXECUTOR_INTERNAL_TOKEN: ${DB_EXECUTOR_INTERNAL_TOKEN:?DB_EXECUTOR_INTERNAL_TOKEN is required}
      # 스크립트 1회용 토큰 서명 키 — db-executor 와 같은 .env 키(32바이트 이상 임의 값). api 가 Tibero Python 단계의 슬롯 조회
      # 토큰을 이 키로 서명하고 db-executor 가 검증한다(WD-78).
      DB_EXECUTOR_SCRIPT_TOKEN_KEY: ${DB_EXECUTOR_SCRIPT_TOKEN_KEY:?DB_EXECUTOR_SCRIPT_TOKEN_KEY is required}
      # X-Forwarded-For 를 믿을 리버스 프록시 대역(WD-402, 쉼표 구분 CIDR). 비우면 루프백·사설망 전체를 믿는다.
      # 운영자는 web/admin nginx 컨테이너 주소(고정 IP)나 그 전용 네트워크 대역으로 좁혀, 같은 내부망의 다른 컨테이너가 IP 를 위조하지 못하게 한다.
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # Tibero 테넌트 SQL 실행기(WD-77). 포트는 외부에 공개하지 않고 api 만 firehub-net 으로 호출한다.
  db-executor:
    build:
      context: ./apps/firehub-db-executor
      dockerfile: Dockerfile
    environment:
      # api 의 DB_EXECUTOR_INTERNAL_TOKEN 과 **같은 .env 키**(Python 실행기의 EXECUTOR_INTERNAL_TOKEN 과는 다른 값).
      DB_EXECUTOR_INTERNAL_TOKEN: ${DB_EXECUTOR_INTERNAL_TOKEN:?DB_EXECUTOR_INTERNAL_TOKEN is required}
      # Python 실행기 전용 적재 토큰 — /execute/load 만 허용. executor 의 EXECUTOR_DB_EXECUTOR_LOAD_TOKEN 과 같은 .env 키.
      DB_EXECUTOR_LOAD_TOKEN: ${DB_EXECUTOR_LOAD_TOKEN:?DB_EXECUTOR_LOAD_TOKEN is required}
      DB_EXECUTOR_SCRIPT_TOKEN_KEY: ${DB_EXECUTOR_SCRIPT_TOKEN_KEY:?DB_EXECUTOR_SCRIPT_TOKEN_KEY is required}
      # 테넌트 저장소 기술자(/internal/executor/**)를 조회할 api 주소.
      DB_EXECUTOR_API_BASE_URL: http://api:8080
    networks:
      - firehub-net
    # 헬스는 정확히 /actuator/health 만 열려 있다(하위 경로는 401).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  executor:
    build:
      context: ./apps/firehub-executor
      dockerfile: Dockerfile
    environment:
      EXECUTOR_DB_HOST: db
      EXECUTOR_DB_PORT: "5432"
      EXECUTOR_DB_NAME: ${POSTGRES_DB:-smartfirehub}
      EXECUTOR_DB_USER: pipeline_executor
      EXECUTOR_DB_PASSWORD: ${PIPELINE_EXECUTOR_PASSWORD}
      # api 의 PIPELINE_ROLE_PASSWORD_SECRET 과 **같은 .env 변수**를 읽는다 — 이름만 다르고 값은
      # 하나다. 두 서비스가 각자 HMAC 으로 테넌트 롤 비밀번호를 파생하므로 값이 갈리면 executor 가
      # 모든 파이프라인 스텝에서 인증 실패한다(조용히 남의 테넌트에 붙는 일은 없다).
      EXECUTOR_ROLE_PASSWORD_SECRET: ${PIPELINE_ROLE_PASSWORD_SECRET}
      EXECUTOR_INTERNAL_SERVICE_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-executor-token}
      # 테넌트 저장소 기술자(/internal/executor/**)를 조회할 api 주소(WD-75). 같은 네트워크의 api 서비스를 가리킨다.
      EXECUTOR_API_BASE_URL: http://api:8080
      # Tibero 적재는 db-executor 로만 보낸다(Python 은 Tibero 에 직접 접속하지 않는다). 적재 토큰은 /execute/load 만 허용된다.
      EXECUTOR_DB_EXECUTOR_BASE_URL: http://db-executor:8090
      EXECUTOR_DB_EXECUTOR_LOAD_TOKEN: ${DB_EXECUTOR_LOAD_TOKEN:?DB_EXECUTOR_LOAD_TOKEN is required}
      EXECUTOR_NSJAIL_ENABLED: "true"
      EXECUTOR_NSJAIL_PATH: /usr/sbin/nsjail
      EXECUTOR_PYTHON_PACKAGES_DIR: /opt/python-packages
    depends_on:
      db:
        condition: service_healthy
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    # nsjail 샌드박스는 새 마운트 네임스페이스에서 루트를 private 로 remount 한다. 그 mount(2) 를
    # 막는 계층이 **셋**이라 셋 다 풀어야 한다 — capability(SYS_ADMIN, 없으면 EPERM), seccomp,
    # 그리고 AppArmor(거부 시 EACCES). apparmor 항목이 오래 빠져 있었는데, 개발이 macOS 라
    # AppArmor 자체가 없어 드러나지 않았다. Linux 호스트에서 돌리면 Python 스텝이 전부
    # "Launching child process failed" 로 죽는다 — k8s 차트에서 같은 누락으로 실제 발생했다.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

  ai-agent:
    build:
      context: .
      dockerfile: apps/firehub-ai-agent/Dockerfile
    environment:
      PORT: "3001"
      INTERNAL_SERVICE_TOKEN: ${AGENT_INTERNAL_TOKEN}
      API_BASE_URL: http://api:8080/api/v1
      MAX_TURNS: ${MAX_TURNS:-10}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/agent/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/firehub-web/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - firehub-net
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-9998}:8080"
    networks:
      - firehub-net
    restart: unless-stopped

networks:
  firehub-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
