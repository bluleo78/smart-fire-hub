services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfirehub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-smartfirehub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # FILE 오브젝트 데이터셋용 S3 호환 스토리지
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    # 브라우저가 presigned URL로 MinIO에 직접 GET/PUT하려면 9000 API 포트를 호스트에 공개해야 한다.
    # (공유기에서 외부 → 호스트:9000 TCP 포워딩 병행 필요. 공개 호스트는 MINIO_PUBLIC_ENDPOINT로 지정.)
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # prod: 브라우저 도달 가능한 공개 웹 오리진을 CORS로 허용해야 썸네일/업로드가 동작한다.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:?web origin required}
    volumes:
      - miniodata:/data
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 최초 기동 시 FILE 데이터셋용 버킷을 자동 생성하는 일회성 컨테이너 (dev docker-compose.yml 의 minio-init 과 동일 역할)
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - firehub-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-firehub-files} &&
      echo '버킷 준비 완료';
      "

  api:
    build:
      context: ./apps/firehub-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_DB: ${POSTGRES_DB:-smartfirehub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 런타임 접속은 비특권 롤 app_tenant(RLS fail-closed, V83). application-prod.yml 이
      # 기본값 없이 ${POSTGRES_RUNTIME_PASSWORD} 를 읽으므로 이 매핑이 없으면 컨텍스트 로딩이 실패한다.
      # compose 의 .env 는 ${...} 치환용이라 여기서 명시하지 않으면 컨테이너에 주입되지 않는다.
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required}
      PIPELINE_EXECUTOR_PASSWORD: ${PIPELINE_EXECUTOR_PASSWORD:?PIPELINE_EXECUTOR_PASSWORD is required}
      # 테넌트별 파이프라인 롤(pipeline_executor_t{id}) 비밀번호 파생 HMAC 키(P3-b1/V111).
      # api 와 executor 가 각자 독립적으로 같은 비밀번호를 파생하므로 두 값이 **반드시 동일**해야 한다
      # → .env 변수 하나를 두 서비스에 매핑한다(아래 executor 의 EXECUTOR_ROLE_PASSWORD_SECRET).
      # 서로 다른 값을 넣으면 기동은 되고 모든 파이프라인 스텝이 DB 인증 실패한다.
      PIPELINE_ROLE_PASSWORD_SECRET: ${PIPELINE_ROLE_PASSWORD_SECRET:?PIPELINE_ROLE_PASSWORD_SECRET is required}
      # FILE 오브젝트 데이터셋용 MinIO 접속 정보. MinIO 컨테이너는 MINIO_ROOT_USER/PASSWORD 이름을 쓰지만
      # API 는 MINIO_ACCESS_KEY/SECRET_KEY 를 읽으므로 여기서 두 이름을 매핑해준다(변수명 불일치 방지).
      MINIO_ENDPOINT: http://minio:9000
      # presign 서명 전용 공개 엔드포인트(브라우저가 직접 도달하는 호스트). 내부 endpoint와 분리한다.
      # 미지정 시 내부 endpoint로 폴백되나, 그 경우 브라우저 업로드/썸네일은 동작하지 않으므로 .env에서 공개 호스트로 지정할 것.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-firehub-files}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  executor:
    build:
      context: ./apps/firehub-executor
      dockerfile: Dockerfile
    environment:
      EXECUTOR_DB_HOST: db
      EXECUTOR_DB_PORT: "5432"
      EXECUTOR_DB_NAME: ${POSTGRES_DB:-smartfirehub}
      EXECUTOR_DB_USER: pipeline_executor
      EXECUTOR_DB_PASSWORD: ${PIPELINE_EXECUTOR_PASSWORD}
      # api 의 PIPELINE_ROLE_PASSWORD_SECRET 과 **같은 .env 변수**를 읽는다 — 이름만 다르고 값은
      # 하나다. 두 서비스가 각자 HMAC 으로 테넌트 롤 비밀번호를 파생하므로 값이 갈리면 executor 가
      # 모든 파이프라인 스텝에서 인증 실패한다(조용히 남의 테넌트에 붙는 일은 없다).
      EXECUTOR_ROLE_PASSWORD_SECRET: ${PIPELINE_ROLE_PASSWORD_SECRET}
      EXECUTOR_INTERNAL_SERVICE_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-executor-token}
      EXECUTOR_NSJAIL_ENABLED: "true"
      EXECUTOR_NSJAIL_PATH: /usr/sbin/nsjail
      EXECUTOR_PYTHON_PACKAGES_DIR: /opt/python-packages
    depends_on:
      db:
        condition: service_healthy
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

  ai-agent:
    build:
      context: .
      dockerfile: apps/firehub-ai-agent/Dockerfile
    environment:
      PORT: "3001"
      INTERNAL_SERVICE_TOKEN: ${AGENT_INTERNAL_TOKEN}
      API_BASE_URL: http://api:8080/api/v1
      MAX_TURNS: ${MAX_TURNS:-10}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - firehub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/agent/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/firehub-web/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - firehub-net
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-9998}:8080"
    networks:
      - firehub-net
    restart: unless-stopped

networks:
  firehub-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
