server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # firehub-web 과 달리 client_max_body_size 를 두지 않는다 — admin 은 테넌트·설정
    # 관리뿐이라 대용량(CSV/XLSX) 업로드가 없다.

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Vite hashed assets — long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 런타임 브랜딩(config.js) 블록 없음 — admin 은 화이트라벨 대상이 아니고
    # index.html 에서도 그 스크립트를 빼서 대응한다.

    # /api/ 트리를 통째로 api 서비스에 넘긴다 — nginx 는 /api/platform 과 /api/v1 을
    # 구별할 필요가 없다(구별은 백엔드의 평면 필터가 한다).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering "no";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
