<!doctype html>
<html lang="ko">
  <head>
    <!-- 문서 언어(html[lang])는 ko 고정. UI 전체가 한국어이므로 스크린리더가 한국어 음성 엔진을
         선택하도록 선언한다(WCAG 3.1.1 Level A). i18n 미도입 앱이라 정적 선언으로 충분하며,
         다국어 도입 시 이 값을 런타임에 갱신해야 한다. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Fire Hub</title>
    <!-- 런타임 브랜딩 설정. React 번들보다 먼저 실행되어 타이틀/파비콘을 확정한다(깜빡임 방지). -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
