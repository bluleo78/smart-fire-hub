server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 대용량 CSV/XLSX 업로드 허용 (Spring multipart 한도 512MB와 일치)
    client_max_body_size 512m;

    # WD-1111: 감사 로그 검색어(한글 1,000자 ≈ 9KB 인코딩)가 nginx 기본 요청줄·헤더 버퍼(8k)를 넘지 않게 32k 로 올린다.
    # 백엔드(Tomcat) 한도 server.max-http-request-header-size 와 같은 값.
    large_client_header_buffers 4 32k;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Vite hashed assets — long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 런타임 브랜딩 설정 — 사이트별로 교체(마운트)되는 가변 파일이므로 캐시 금지
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering "no";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
