spring:
  datasource:
    # 런타임 트래픽은 비특권 app_tenant 롤로 흐른다(RLS 적용). 비번은 V83 이 만든 롤의 고정 비번과 일치해야 한다.
    # IntegrationTestBase 또는 @DynamicPropertySource가 Testcontainers URL로 덮어쓴다. 누락 시 로컬 DB에 붙지 않도록 실패 주소를 둔다.
    url: jdbc:postgresql://testcontainers-import-missing.invalid:5432/MISSING_PostgresTestContainer
    username: app_tenant
    password: app_tenant
    hikari:
      # Spring 컨텍스트가 여러 개 캐시되므로 각 컨텍스트의 유휴 DB 커넥션 수를 줄인다.
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
      # app_tenant 롤/GRANT 는 Flyway(app)가 만든다. 첫 부팅 시 마이그레이션 전 접속 실패를 피하려고
      # 시작 접속 시도를 끄고 첫 쿼리에서 지연 접속한다.
      initialization-fail-timeout: -1
  flyway:
    # 마이그레이션은 롤 생성·GRANT·백필이 필요하므로 소유자 롤(app)로 실행한다.
    url: jdbc:postgresql://testcontainers-import-missing.invalid:5432/MISSING_PostgresTestContainer
    user: app
    password: app
    validate-on-migrate: false

org:
  jobrunr:
    background-job-server:
      enabled: false
    dashboard:
      enabled: false

notification:
  scheduler:
    # 알림 스케줄러 3종(워커 폴링·스위퍼·게이지 갱신)의 기동 1회 실행을 스위트 길이 밖으로 민다.
    # 기동 폴링/스위핑이 다른 테스트의 스크래치 테넌트 행을 가로채는 것을 막고, 게이지 테스트가
    # 값을 두 번 단언하는 사이 갱신이 끼어드는 것도 막는다. 프로덕션 기본값은 0(기동 즉시 1회)이며
    # 이 노브의 실소비자는 테스트뿐이다 — jobrunr background-job-server·login-attempts cleanup 을
    # 여기서 끄는 것과 같은 자리다.
    initial_delay_ms: 3600000

app:
  login-attempts:
    cleanup:
      enabled: false
  jwt:
    secret: dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBIUzI1NiBhbGdvcml0aG0gdGhhdCBpcyBhdCBsZWFzdCAyNTYgYml0cw==
    access-expiration: 1800000
    refresh-expiration: 604800000
  encryption:
    master-key: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzLWhlcmU=
  cors:
    allowed-origins: http://localhost:5173
  pipeline:
    datasource:
      url: jdbc:postgresql://testcontainers-import-missing.invalid:5432/MISSING_PostgresTestContainer
      password: pipeline_exec_pwd
    # 테넌트별 파이프라인 실행 롤(pipeline_executor_t{id}) 비밀번호 파생 HMAC 키.
    # RolePasswordSyncCallback 이 이 값으로 매 기동마다 DB 쪽 비밀번호를 맞춘다(T1 TenantPipelineRole).
    role-password-secret: test-tenant-pipeline-secret
    # 자동 롤 프로비저닝을 끈다 — pg_roles 는 DB가 아니라 클러스터 전역이고, 통합 테스트는
    # JVM 내 Testcontainers DB를 공유하므로 테스트 컨텍스트마다 LOGIN 롤을 만들면 스위트 실행 중 누적된다.
    # 기계장치 자체는 꺼지지 않는다 — TenantPipelineRoleProvisioner.ensureRole 은 이 플래그와
    # 무관하게 동작하며, 통합 테스트는 그것을 직접 부른다.
    role-auto-provision: false
    tenant-pool:
      # 상한을 작게 잡아 TenantPipelineDataSourceRegistryTest 가 소수의 가짜 테넌트로도 LRU 축출을
      # 실제로 관측할 수 있게 한다. 이 레지스트리를 아직 이 태스크 외에는 아무도 쓰지 않는다.
      max-pools: 3
      max-size: 1
      idle-timeout-ms: 600000
  executor:
    enabled: false  # tests use direct execution

agent:
  url: http://localhost:9999
  internal-token: test-internal-token

channel:
  internal-token: test-internal-token

row-search:
  sync:
    # 테스트는 RowSearchSyncService 를 직접 호출한다. 백그라운드 스윕이 끼어들면 호출 횟수 단언이 흔들린다.
    enabled: false
