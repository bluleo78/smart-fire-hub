# V124(백필 루프)을 Flyway 트랜잭션 밖에서 실행한다(되돌리지 말 것).
#
# 이유: 이 스크립트는 데이터셋 테이블마다 ACCESS EXCLUSIVE 를 잡는 DDL(ALTER ADD COLUMN, CREATE TRIGGER)을
# 실행한다. 한 트랜잭션 안이면 첫 테이블의 락이 마이그레이션 전체가 커밋될 때까지 풀리지 않아
# 모든 데이터셋 테이블이 동시에 배타 잠금 상태가 된다. 지금은 DO 블록이 테이블마다 COMMIT 하며,
# plpgsql 의 COMMIT 은 트랜잭션 블록 안에서는 쓸 수 없으므로 이 설정이 반드시 필요하다.
# (Flyway 10.20.1 은 이 설정을 SQL 주석이 아니라 이 .conf 사이드카에서만 읽는다 — SqlScriptMetadata 참조.)
#
# 대가: 실패 시 롤백이 없고 flyway_schema_history 에 success=false 행이 남아 이후 기동이 막힌다.
# 그래서 실패할 수 있는 작업(함수 정의·pipeline_step ALTER·이름 충돌 검사)은 전부 트랜잭션
# 마이그레이션인 V123 에 두고, 이 파일에는 테이블 단위로 건너뛰어도 되는 작업만 남겼다.
# 스크립트 자체는 전부 IF NOT EXISTS / DROP ... IF EXISTS / CREATE OR REPLACE 라 재실행에 안전하다.
executeInTransaction=false
