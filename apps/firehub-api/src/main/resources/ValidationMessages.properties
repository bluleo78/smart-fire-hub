# Bean Validation 기본 문구 한국어화 (WD-570)
#
# 무엇: jakarta.validation 표준 제약(과 Hibernate Validator 확장 제약)의 기본 문구를 한국어로 덮어쓴다.
# 왜: 이 파일이 없으면 message= 를 명시하지 않은 DTO 제약은 Hibernate Validator 의 영어 기본 문구
#     (예: "must not be blank")로 응답돼 화면에 그대로 보였다.
#
# - 로케일 접미사 없는 기본 번들(ValidationMessages.properties)로 둔다. Spring 의 LocaleContextMessageInterpolator 는
#   요청 Accept-Language(예: en)로 번들을 찾는데, _ko 로 두면 en·JVM 기본 로케일 요청에서 HV 영어 문구로 떨어진다.
#   기본 번들은 어떤 로케일이든 마지막 후보로 잡히므로 항상 한국어가 나간다(사용자 번들이 HV 내장 번들보다 우선).
# - 인코딩: Hibernate Validator 의 PlatformResourceBundleLocator 는 ResourceBundle.getBundle 로 읽고,
#   Java 9+ PropertyResourceBundle 은 properties 를 UTF-8 로 읽는다 → 한글을 그대로 적는다(통합 테스트가 정확한 문구로 검증).
# - 문구에 필드명을 넣지 않는다. 웹이 필드 오류를 해당 입력 아래에 표시하므로 짧은 문장이 자연스럽다.
# - 문구에 ${...} 는 HV 의 EL 식이다(min/max 기본값에 따라 문장을 고른다). {min} 등은 제약 속성 값으로 치환된다.

# ── jakarta.validation 표준 제약 ─────────────────────────────────────
jakarta.validation.constraints.NotBlank.message=필수 입력값입니다.
jakarta.validation.constraints.NotNull.message=필수 입력값입니다.
# 문자열·컬렉션·맵에 모두 붙으므로(예: 설정 맵, 정렬 id 목록) 둘 다 읽히는 문구로 둔다.
jakarta.validation.constraints.NotEmpty.message=비어 있을 수 없습니다.
jakarta.validation.constraints.Null.message=값을 지정할 수 없습니다.
# Size: 이 코드베이스의 메시지 없는 @Size 는 거의 문자열(max 만 지정)이라 「자」 기준으로 쓴다.
#   max 만 지정(min=0) → 「N자 이하」, min 만 지정(max=Integer.MAX_VALUE) → 「N자 이상」, 둘 다 → 범위.
#   트레이드오프: 컬렉션에 메시지 없이 붙이면 「자」가 어색하므로 컬렉션에는 message= 를 명시한다(BatchRowDataRequest.rows).
jakarta.validation.constraints.Size.message=${min == 0 ? max += '자 이하로 입력하세요.' : (max == 2147483647 ? min += '자 이상 입력하세요.' : min += '자 이상 ' += max += '자 이하로 입력하세요.')}
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다.
jakarta.validation.constraints.Max.message={value} 이하여야 합니다.
jakarta.validation.constraints.DecimalMin.message={value} ${inclusive == true ? '이상이어야' : '보다 커야'} 합니다.
jakarta.validation.constraints.DecimalMax.message={value} ${inclusive == true ? '이하여야' : '보다 작아야'} 합니다.
jakarta.validation.constraints.Digits.message=정수 {integer}자리, 소수 {fraction}자리 이내로 입력하세요.
jakarta.validation.constraints.Positive.message=0보다 커야 합니다.
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다.
jakarta.validation.constraints.Negative.message=0보다 작아야 합니다.
jakarta.validation.constraints.NegativeOrZero.message=0 이하여야 합니다.
jakarta.validation.constraints.Email.message=올바른 이메일 형식이 아닙니다.
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다.
jakarta.validation.constraints.Past.message=과거 날짜여야 합니다.
jakarta.validation.constraints.PastOrPresent.message=현재 또는 과거 날짜여야 합니다.
jakarta.validation.constraints.Future.message=미래 날짜여야 합니다.
jakarta.validation.constraints.FutureOrPresent.message=현재 또는 미래 날짜여야 합니다.
jakarta.validation.constraints.AssertTrue.message=true 여야 합니다.
jakarta.validation.constraints.AssertFalse.message=false 여야 합니다.

# ── Hibernate Validator 확장 제약 ──────────────────────────────────
# 현재 코드베이스는 org.hibernate.validator.constraints 를 쓰지 않는다. 나중에 붙여도 영어로 새지 않도록 흔한 것만 둔다.
# Length·Range 도 기본 min=0 / max=최댓값이라 Size 와 같은 방식으로 열린 끝을 문장에서 뺀다.
org.hibernate.validator.constraints.Length.message=${min == 0 ? max += '자 이하로 입력하세요.' : (max == 2147483647 ? min += '자 이상 입력하세요.' : min += '자 이상 ' += max += '자 이하로 입력하세요.')}
org.hibernate.validator.constraints.URL.message=올바른 URL 형식이 아닙니다.
org.hibernate.validator.constraints.Range.message=${min == 0 ? max += ' 이하여야 합니다.' : (max == 9223372036854775807 ? min += ' 이상이어야 합니다.' : min += ' 이상 ' += max += ' 이하여야 합니다.')}
