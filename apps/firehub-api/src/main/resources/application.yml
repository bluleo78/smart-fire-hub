spring:
  application:
    name: smart-fire-hub
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 80
    # 런타임 접속(spring.datasource)은 비특권 app_tenant 롤, 마이그레이션(spring.flyway)은 소유자 롤(app) —
    # 실제 url/username/password 는 프로필별(test/local/prod)로 분리 정의한다.
    postgresql:
      # Flyway 의 PostgreSQL 기본 잠금은 pg_try_advisory_xact_lock — 즉 **트랜잭션 수준** 잠금이라
      # 메타데이터 커넥션이 마이그레이션 내내 "idle in transaction" 으로 열린 트랜잭션을 붙들고 있다.
      # 그 상태에서 V125 의 CREATE INDEX CONCURRENTLY 는 그 트랜잭션이 끝나기를 기다리는데, 그 트랜잭션은
      # 마이그레이션이 끝나야 닫히므로 **영원히 멈춘다**(실측 2026-09-21: 테스트 기동이 15분 넘게 hang,
      # pg_stat_activity 에서 CIC 가 wait_event=virtualxid 로 대기, 상대 pid 는 Flyway 의
      # "SELECT COUNT(*) FROM pg_namespace" 커넥션). false 로 두면 세션 수준(pg_try_advisory_lock)
      # 잠금을 쓰므로 열린 트랜잭션이 없고 CIC 가 정상 진행한다. 잠금의 상호배제 효과는 그대로다.
      transactional-lock: false
  task:
    scheduling:
      pool:
        # @Scheduled 메서드가 36개인데 기본 풀 크기는 1이다. 한 스레드에 전부 직렬화되면 느린 잡
        # 하나(예: 기동 직후 도는 게이지 갱신 — 테넌트 수 N 에 1+N 쿼리)가 아웃박스 폴링 같은
        # 지연 민감 잡의 앞을 막는다. 4는 "동시에 돌 수 있어야 하는 잡"(아웃박스 폴링·스위퍼·
        # 게이지 갱신·정리류)의 개수에서 왔다. 운영·개발 모두 같은 이유가 성립하므로 기본 프로필에 둔다.
        size: 4
  servlet:
    multipart:
      # 대용량 CSV/XLSX 임포트 허용. 미리보기는 CSV를 앞부분만 잘라 보내지만(413 회피),
      # 실제 검증/임포트는 파일 전체를 전송하므로 400MB급 파일까지 여유 있게 수용한다.
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: 8080

org:
  jobrunr:
    # 테이블 생성은 Flyway(V85)가 담당한다 — 런타임 롤(app_tenant)은 DDL 권한이 없다.
    database:
      skip-create: true
    background-job-server:
      enabled: true
      delete-succeeded-jobs-after: 720h
      permanently-delete-deleted-jobs-after: 2160h
    dashboard:
      enabled: false

app:
  branding:
    # 화이트라벨링용 브랜드명. 배포처별로 APP_BRANDING_NAME 환경변수로 덮어쓴다. 미설정 시 기본값 사용.
    name: ${APP_BRANDING_NAME:Smart Fire Hub}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000
    refresh-expiration: 604800000
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  pipeline:
    datasource:
      url: ${spring.datasource.url}
      # username 키는 #681 에서 제거했다 — 읽는 코드가 하나도 남지 않았다. 파이프라인 실행 접속은
      # 전부 테넌트별 롤(pipeline_executor_t{id})로 하고, 롤 이름은 TenantPipelineRole 이 파생한다.
      # 아래 password 는 접속용이 아니라 레거시 공용 롤의 비밀번호를 기동 시 맞추는 용도로만 남는다
      # (RolePasswordSyncCallback). url 은 테넌트와 무관하게 같으므로 계속 쓰인다.
      password: ${PIPELINE_EXECUTOR_PASSWORD:pipeline_exec_pwd}
    # 테넌트별 파이프라인 실행 롤(pipeline_executor_t{id}) 비밀번호를 결정적으로 파생하는 HMAC 키.
    # TenantPipelineRole/TenantPipelineDataSourceRegistry/RolePasswordSyncCallback 이 함께 쓴다.
    role-password-secret: ${PIPELINE_ROLE_PASSWORD_SECRET:tenant-pipeline-role-dev-secret}
    # 테넌트 생성·기동 시 pipeline_executor_t{id} 롤을 자동으로 만들고 설정할지(#680).
    # 끄면 런북 §1-3/§1-5 의 운영자 수동 SQL 절차로 돌아간다 — 그 절차 누락이 2026-09-17 운영
    # 장애의 원인이었으므로 기본값은 켬이다. test 프로필만 끈다(pg_roles 는 클러스터 전역이라
    # 공유 test DB 에 LOGIN 롤이 무한 누적된다 — TenantPipelineRoleProvisioner Javadoc).
    role-auto-provision: ${PIPELINE_ROLE_AUTO_PROVISION:true}
    tenant-pool:
      max-pools: ${PIPELINE_TENANT_POOL_MAX_POOLS:8}
      max-size: ${PIPELINE_TENANT_POOL_MAX_SIZE:2}
      idle-timeout-ms: ${PIPELINE_TENANT_POOL_IDLE_TIMEOUT_MS:600000}
  executor:
    enabled: true
    base-url: ${EXECUTOR_BASE_URL:http://localhost:8000}
    internal-token: ${EXECUTOR_INTERNAL_TOKEN:dev-executor-token}

firehub:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-files-per-request: 3
    expiry-hours: 24
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # presign 서명 전용 공개 엔드포인트. 미지정 시 endpoint로 폴백 → dev/단일호스트 환경은 무변경.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    # presign 서명 리전(MinIO 기본값 us-east-1). 명시해 리전 조회 네트워크 호출을 없앤다.
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:firehub-files}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY:300}
    upload-presign-expiry-seconds: ${MINIO_UPLOAD_PRESIGN_EXPIRY:900}

channel:
  service:
    url: ${CHANNEL_SERVICE_URL:http://firehub-channel:3002}
  internal-token: ${CHANNEL_INTERNAL_TOKEN:dev-channel-token}

notification:
  kakao:
    client_id: ${KAKAO_CLIENT_ID:}
    client_secret: ${KAKAO_CLIENT_SECRET:}
    redirect_uri: ${KAKAO_REDIRECT_URI:https://app.smartfirehub.com/api/v1/oauth/kakao/callback}
  slack:
    client_id: ${SLACK_CLIENT_ID:}
    client_secret: ${SLACK_CLIENT_SECRET:}
    redirect_uri: ${SLACK_REDIRECT_URI:https://app.smartfirehub.com/api/v1/oauth/slack/callback}
    scopes: chat:write,im:write,im:history,users:read,reactions:write,app_mentions:read
