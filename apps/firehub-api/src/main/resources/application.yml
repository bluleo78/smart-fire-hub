spring:
  application:
    name: smart-fire-hub
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 80
    # 런타임 접속(spring.datasource)은 비특권 app_tenant 롤, 마이그레이션(spring.flyway)은 소유자 롤(app) —
    # 실제 url/username/password 는 프로필별(test/local/prod)로 분리 정의한다.
  task:
    scheduling:
      pool:
        # @Scheduled 메서드가 36개인데 기본 풀 크기는 1이다. 한 스레드에 전부 직렬화되면 느린 잡
        # 하나(예: 기동 직후 도는 게이지 갱신 — 테넌트 수 N 에 1+N 쿼리)가 아웃박스 폴링 같은
        # 지연 민감 잡의 앞을 막는다. 4는 "동시에 돌 수 있어야 하는 잡"(아웃박스 폴링·스위퍼·
        # 게이지 갱신·정리류)의 개수에서 왔다. 운영·개발 모두 같은 이유가 성립하므로 기본 프로필에 둔다.
        size: 4
  servlet:
    multipart:
      # 대용량 CSV/XLSX 임포트 허용. 미리보기는 CSV를 앞부분만 잘라 보내지만(413 회피),
      # 실제 검증/임포트는 파일 전체를 전송하므로 400MB급 파일까지 여유 있게 수용한다.
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: 8080

org:
  jobrunr:
    # 테이블 생성은 Flyway(V85)가 담당한다 — 런타임 롤(app_tenant)은 DDL 권한이 없다.
    database:
      skip-create: true
    background-job-server:
      enabled: true
      delete-succeeded-jobs-after: 720h
      permanently-delete-deleted-jobs-after: 2160h
    dashboard:
      enabled: false

app:
  branding:
    # 화이트라벨링용 브랜드명. 배포처별로 APP_BRANDING_NAME 환경변수로 덮어쓴다. 미설정 시 기본값 사용.
    name: ${APP_BRANDING_NAME:Smart Fire Hub}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000
    refresh-expiration: 604800000
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  pipeline:
    datasource:
      url: ${spring.datasource.url}
      username: pipeline_executor
      password: ${PIPELINE_EXECUTOR_PASSWORD:pipeline_exec_pwd}
  executor:
    enabled: true
    base-url: ${EXECUTOR_BASE_URL:http://localhost:8000}
    internal-token: ${EXECUTOR_INTERNAL_TOKEN:dev-executor-token}

firehub:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-files-per-request: 3
    expiry-hours: 24
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # presign 서명 전용 공개 엔드포인트. 미지정 시 endpoint로 폴백 → dev/단일호스트 환경은 무변경.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    # presign 서명 리전(MinIO 기본값 us-east-1). 명시해 리전 조회 네트워크 호출을 없앤다.
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:firehub-files}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY:300}
    upload-presign-expiry-seconds: ${MINIO_UPLOAD_PRESIGN_EXPIRY:900}

channel:
  service:
    url: ${CHANNEL_SERVICE_URL:http://firehub-channel:3002}
  internal-token: ${CHANNEL_INTERNAL_TOKEN:dev-channel-token}

notification:
  kakao:
    client_id: ${KAKAO_CLIENT_ID:}
    client_secret: ${KAKAO_CLIENT_SECRET:}
    redirect_uri: ${KAKAO_REDIRECT_URI:https://app.smartfirehub.com/api/v1/oauth/kakao/callback}
  slack:
    client_id: ${SLACK_CLIENT_ID:}
    client_secret: ${SLACK_CLIENT_SECRET:}
    redirect_uri: ${SLACK_REDIRECT_URI:https://app.smartfirehub.com/api/v1/oauth/slack/callback}
    scopes: chat:write,im:write,im:history,users:read,reactions:write,app_mentions:read
