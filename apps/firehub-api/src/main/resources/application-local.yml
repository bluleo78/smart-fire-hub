server:
  port: 5010

spring:
  datasource:
    # 런타임은 비특권 app_tenant 롤(RLS fail-closed). 마이그레이션은 아래 flyway(소유자 롤)로.
    url: jdbc:postgresql://localhost:5432/smartfirehub
    username: app_tenant
    password: app_tenant
    hikari:
      # V83 이 롤을 만들기 전(최초 기동) 기동 실패를 피하려고 시작 접속을 끄고 지연 접속한다.
      initialization-fail-timeout: -1
  flyway:
    # 마이그레이션은 롤 생성·GRANT·백필이 필요하므로 소유자 롤(app)로 실행한다.
    url: jdbc:postgresql://localhost:5432/smartfirehub
    user: app
    password: app

org:
  jobrunr:
    dashboard:
      enabled: true
      port: 5040

app:
  base-url: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1rZXktdGhpcy1pcy1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl}
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:bG9jYWwtZGV2LW1hc3Rlci1rZXktZm9yLWVuY3J5cHQ=}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5020,http://localhost:5050
  pipeline:
    datasource:
      url: jdbc:postgresql://localhost:5432/smartfirehub
      password: pipeline_exec_pwd
    # Tibero 테넌트 Python 단계(실행기 끔)의 조회 도우미 genia_db.py 위치 — 자식 프로세스 PYTHONPATH(WD-78). api 앱 디렉터리 기준 상대 경로.
    python-helper-dir: ../firehub-executor/sandbox
  executor:
    enabled: false  # local dev: direct execution (no executor service needed)
    # 로컬은 기본 토큰(dev-executor-token)으로 저장소 기술자 엔드포인트를 쓸 수 있게 한다. 다른 프로필에는 두지 않는다.
    allow-default-token: true
  db-executor:
    # 로컬 개발: 맥에서 띄운 firehub-db-executor(포트 8090). executor.enabled=false 여도 Tibero 테넌트는 이 주소로만 실행한다.
    base-url: http://localhost:8090
    # firehub-db-executor 의 application-local.yml 기본값(dev-db-executor-token)과 같다. executor.internal-token(dev-executor-token)과
    # 달라야 api 가 기동한다.
    internal-token: ${DB_EXECUTOR_INTERNAL_TOKEN:dev-db-executor-token}
  embedding:
    ollama-allowed-base-urls: http://host.docker.internal:11434,http://localhost:11434

agent:
  url: http://127.0.0.1:5020
  internal-token: ${AGENT_INTERNAL_TOKEN:firehub-local-dev-internal-token}
