server:
  port: 5010

spring:
  datasource:
    # 런타임은 비특권 app_tenant 롤(RLS fail-closed). 마이그레이션은 아래 flyway(소유자 롤)로.
    url: jdbc:postgresql://localhost:5432/smartfirehub
    username: app_tenant
    password: app_tenant
    hikari:
      # V83 이 롤을 만들기 전(최초 기동) 기동 실패를 피하려고 시작 접속을 끄고 지연 접속한다.
      initialization-fail-timeout: -1
  flyway:
    # 마이그레이션은 롤 생성·GRANT·백필이 필요하므로 소유자 롤(app)로 실행한다.
    url: jdbc:postgresql://localhost:5432/smartfirehub
    user: app
    password: app

org:
  jobrunr:
    dashboard:
      enabled: true
      port: 5040

app:
  base-url: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1rZXktdGhpcy1pcy1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl}
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:bG9jYWwtZGV2LW1hc3Rlci1rZXktZm9yLWVuY3J5cHQ=}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5020,http://localhost:5050
  pipeline:
    datasource:
      url: jdbc:postgresql://localhost:5432/smartfirehub
      username: pipeline_executor
      password: pipeline_exec_pwd
  executor:
    enabled: false  # local dev: direct execution (no executor service needed)

agent:
  url: http://127.0.0.1:5020
  internal-token: ${AGENT_INTERNAL_TOKEN:firehub-local-dev-internal-token}
