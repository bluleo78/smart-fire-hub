# work-loop 격리 라이브 스택의 「저장소 전용」 인프라(compose).
# - 루트 docker-compose.yml 을 재사용하지 않는다: 그쪽은 고정 container_name(neo4j)과 ./db-data 바인드 마운트를
#   쓰므로 같이 띄우면 다른 세션의 개발 DB·컨테이너와 충돌한다.
# - PostgreSQL·MinIO 는 평소 컴퓨터 공용 바탕(compose.shared.yml)을 쓴다. 이 파일은 저장소마다 따로 띄우는 것만 둔다:
#     own-db 프로필 : --own-db 일 때만 이 저장소 전용 PostgreSQL(공유 서버를 못 쓸 때의 탈출구)
#     graph  프로필 : --with-neo4j 일 때만 Neo4j
# - 프로젝트 이름은 스크립트가 -p $STACK_ID(저장소마다 다름)로 주고, 명명 볼륨도 그 project 소속이다. 포트는 127.0.0.1 에만 바인드한다.
# - 포트는 scripts/work-loop-stack.sh 가 환경변수로 주입한다(up 이 빈 포트를 고른다).
services:
  db:
    # 공유 서버의 db 정의(이미지·명령·환경·헬스체크)를 그대로 쓰고, 프로필과 호스트 포트만 바꾼다.
    extends:
      file: compose.shared.yml
      service: db
    profiles: ["own-db"]
    ports: !override
      - "127.0.0.1:${WL_DB_PORT:-6433}:5432"

  # GraphRAG 그래프 DB — 선택(WL_WITH_NEO4J=1 / --with-neo4j 일 때만 graph 프로필로 기동)
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    ports:
      - "127.0.0.1:${WL_NEO4J_HTTP_PORT:-6474}:7474"
      - "127.0.0.1:${WL_NEO4J_BOLT_PORT:-6687}:7687"
    environment:
      NEO4J_AUTH: neo4j/firehub-graph-dev
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
